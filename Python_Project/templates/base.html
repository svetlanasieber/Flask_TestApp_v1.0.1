<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Multi-platform Calculator{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, #8e2de2, #4a00e0);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            color: #fff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
        }
        
        .form-check {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .form-check input {
            margin-right: 10px;
        }
        
        .btn-primary {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #4a00e0, #8e2de2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(45deg, #5d00ff, #b82cff);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-secondary {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            margin-right: 10px;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .flash-messages {
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255, 65, 65, 0.15);
            border-radius: 8px;
        }
        
        .flash-message {
            margin: 5px 0;
            color: #fff;
        }
        
        .user-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 50px;
            color: #fff;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .auth-links a, .user-info a {
            color: #fff;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .auth-links a:hover, .user-info a:hover {
            opacity: 1;
        }
        
        /* Settings and history pages */
        .settings-container, .history-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            color: #fff;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        
        .history-table th, .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .history-table th {
            background: rgba(0, 0, 0, 0.2);
            font-weight: 600;
        }
        
        .history-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .btn-small {
            padding: 5px 10px;
            background: rgba(76, 175, 80, 0.3);
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-small:hover {
            background: rgba(76, 175, 80, 0.5);
        }
        
        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        
        /* Theme-specific styles */
        body.dark {
            background: linear-gradient(45deg, #121212, #323232);
        }
        
        body.light {
            background: linear-gradient(45deg, #3494e6, #ec6ead);
        }
    </style>
    {% block additional_styles %}{% endblock %}
</head>
<body class="{{ theme|default('standard') }}">
    <div class="user-panel">
        {% if current_user.is_authenticated %}
            <div class="user-info">
                <span>Hello, {{ current_user.username }}!</span>
                <a href="{{ url_for('user_settings') }}">⚙️ Settings</a>
                <a href="{{ url_for('view_history') }}">📜 History</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        {% else %}
            <div class="auth-links">
                <a href="{{ url_for('login') }}">Login</a> | 
                <a href="{{ url_for('register') }}">Register</a>
            </div>
        {% endif %}
    </div>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    {% block scripts %}{% endblock %}
</body>
</html>
